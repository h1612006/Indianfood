<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Manage accounts · Spice Smash</title><link rel="stylesheet" href="styles.css"><style>
body{background:#1f1613;color:#fff}.wrap{max-width:1000px;margin:auto;padding:20px}.panel{background:#2b1d18;border:1px solid #44302a;border-radius:16px;padding:18px;margin:16px 0}.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.form label{display:grid;gap:6px;font-size:13px}.form input,.form select{padding:11px;border:1px solid #5a443b;border-radius:9px;background:#1f1613;color:white;font:inherit}.wide{grid-column:1/-1}.list{display:grid;gap:9px}.entry{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:#1f1613;border-radius:10px}.entry small{display:block;color:#cdb9ad;margin-top:4px}.top{padding:15px 20px;background:#2b1d18;display:flex;justify-content:space-between;gap:12px}.top a{color:#ffd166}
</style></head><body><header class="top"><strong>Spice Smash · Admin account management</strong><span><a href="/admin.html">Kitchen orders</a> · <a href="/">Home</a> · <button id="logout" class="link-btn">Log out</button></span></header>
<main class="wrap"><section class="panel"><h1>Accounts</h1><p>Create customer, kitchen staff and driver accounts directly. Accounts created here are active immediately. Remove accounts when access is no longer needed.</p><form id="create" class="form"><label>Full name<input name="name" required maxlength="80"></label><label>Email / staff ID<input name="email" type="email" required maxlength="160"></label><label>Phone<input name="phone" maxlength="30"></label><label>Account type<select name="role"><option value="customer">Customer</option><option value="chef">Kitchen staff</option><option value="driver">Delivery driver</option></select></label><label>Password<input name="password" type="password" minlength="10" required></label><label class="wide">Address<input name="address" maxlength="200"></label><div class="wide"><button class="btn primary">Create account</button></div></form><p id="message" hidden></p></section>
<section class="panel"><h2>Existing accounts</h2><div id="users" class="list">Loading…</div></section></main><script src="admin-users.js"></script></body></html>
