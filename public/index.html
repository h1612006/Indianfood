<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spice Smash · Sign in</title><meta name="robots" content="noindex"></head>
<body><p style="font:16px system-ui;padding:24px">Opening your Spice Smash account…</p>
<script>
(async()=>{const token=localStorage.getItem("ss_auth_token")||localStorage.getItem("ss_admin_token")||localStorage.getItem("ss_chef_token")||localStorage.getItem("ss_driver_token");if(!token){location.replace("/profile.html");return;}try{const r=await fetch("/api/auth/me",{headers:{Authorization:"Bearer "+token}});if(!r.ok)throw new Error();const {user}=await r.json();location.replace(user.role==="admin"?"/admin-users.html":user.role==="chef"?"/admin.html":user.role==="driver"?"/driver.html":"/menu.html");}catch(_){["ss_auth_token","ss_admin_token","ss_chef_token","ss_driver_token"].forEach(k=>localStorage.removeItem(k));location.replace("/profile.html");}})();
</script></body></html>
