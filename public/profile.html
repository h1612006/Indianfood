<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Account · Spice Smash</title><link rel="stylesheet" href="styles.css"><style>
body{background:#fffaf4}.account-wrap{max-width:520px;margin:32px auto;padding:18px}.account-card{background:#fff;border:1px solid #eadfd4;border-radius:18px;padding:22px;box-shadow:0 10px 30px #4b2c1712}.account-card h1{margin:0 0 8px}.account-card label{display:grid;gap:6px;margin:12px 0;font-weight:700}.account-card input,.account-card select{width:100%;padding:12px;border:1px solid #d7c7ba;border-radius:10px;font:inherit}.switch{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.switch button{border:1px solid #d7c7ba;border-radius:999px;padding:9px 14px;background:white;font-weight:700}.switch button.active{background:#d62828;color:white;border-color:#d62828}.hint{color:#6b625c;font-size:13px}.message{padding:10px;border-radius:10px;background:#fff0df;margin:12px 0}.top{padding:14px 20px;background:#2b1d18;color:white}.top a{color:#ffd166}
</style></head><body><header class="top"><a href="/">← Back to menu</a></header><main class="account-wrap"><section class="account-card"><h1>Your account</h1><p class="hint">Customers can register and order straight away. Chef and driver accounts need admin approval.</p><div class="switch"><button type="button" class="active" data-mode="login">Log in</button><button type="button" data-mode="register">Create account</button></div><form id="accountForm"><div id="nameField" hidden><label>Full name<input name="name" maxlength="80" autocomplete="name"></label></div><label>Email<input name="email" type="email" required autocomplete="email"></label><div id="phoneField" hidden><label>Phone number<input name="phone" type="tel" maxlength="30" autocomplete="tel"></label><label>Delivery address<input name="address" maxlength="200" autocomplete="street-address" placeholder="Street, number, postcode"></label></div><div id="roleField" hidden><label>Account type<select name="role"><option value="customer">Customer</option><option value="chef">Chef / kitchen staff</option><option value="driver">Delivery driver</option></select></label></div><label>Password<input name="password" type="password" minlength="10" required autocomplete="current-password"></label><p class="hint" id="passwordHint">Use your registered email and password. For the administrator account, enter admin as the email and use the admin password.</p><p class="message" id="message" hidden></p><button class="btn primary block" id="submitButton">Log in</button></form><p class="hint" id="profileSummary" hidden></p><button class="btn block" id="logoutButton" hidden>Log out</button></section></main><script src="profile.js"></script></body></html>
